<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julius & Luzalen - Wedding Reception</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="code-entry">
            <h1>Julius & Luzalen</h1>
            <h2>Wedding Reception</h2>
            <p>Please enter your invitation code to view details and RSVP</p>
            <form id="codeForm">
                <input type="text" id="codeInput" placeholder="Enter your code" required pattern="\S+" title="Code cannot contain spaces">
                <button type="submit">Enter</button>
            </form>
            <p id="errorMsg" class="error"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
